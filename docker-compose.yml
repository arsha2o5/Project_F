services:

  mysql:
    image: mysql:8.4

    container_name: projectf-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: project_f_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:

    build: ./backend
    
    restart: unless-stopped

    container_name: mobappbackend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    depends_on:
      - mysql

volumes:
  mysql_data: